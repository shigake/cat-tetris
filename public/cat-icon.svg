<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <!-- Cat body gradient -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD5A0"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <!-- Cat belly -->
    <linearGradient id="belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Subtle grid pattern (tetris feel) -->
  <g opacity="0.06">
    <line x1="128" y1="0" x2="128" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Tetris pieces in background corners -->
  <!-- S-piece (green) top-left -->
  <g opacity="0.35">
    <rect x="30" y="42" width="34" height="34" rx="5" fill="#2ecc71"/>
    <rect x="64" y="42" width="34" height="34" rx="5" fill="#2ecc71"/>
    <rect x="64" y="76" width="34" height="34" rx="5" fill="#2ecc71"/>
    <rect x="98" y="76" width="34" height="34" rx="5" fill="#2ecc71"/>
  </g>
  <!-- L-piece (orange) top-right -->
  <g opacity="0.35">
    <rect x="395" y="35" width="32" height="32" rx="5" fill="#e67e22"/>
    <rect x="395" y="67" width="32" height="32" rx="5" fill="#e67e22"/>
    <rect x="395" y="99" width="32" height="32" rx="5" fill="#e67e22"/>
    <rect x="427" y="99" width="32" height="32" rx="5" fill="#e67e22"/>
  </g>
  <!-- I-piece (cyan) bottom-left -->
  <g opacity="0.3">
    <rect x="28" y="438" width="30" height="30" rx="4" fill="#00bcd4"/>
    <rect x="58" y="438" width="30" height="30" rx="4" fill="#00bcd4"/>
    <rect x="88" y="438" width="30" height="30" rx="4" fill="#00bcd4"/>
    <rect x="118" y="438" width="30" height="30" rx="4" fill="#00bcd4"/>
  </g>
  <!-- Z-piece (red) bottom-right -->
  <g opacity="0.3">
    <rect x="380" y="430" width="32" height="32" rx="5" fill="#e74c3c"/>
    <rect x="412" y="430" width="32" height="32" rx="5" fill="#e74c3c"/>
    <rect x="412" y="462" width="32" height="32" rx="5" fill="#e74c3c"/>
    <rect x="444" y="462" width="32" height="32" rx="5" fill="#e74c3c"/>
  </g>

  <!-- ===== T-PIECE (below cat, clearly separated) ===== -->
  <g filter="url(#glow)">
    <rect x="186" y="410" width="40" height="40" rx="7" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
    <rect x="226" y="410" width="40" height="40" rx="7" fill="#af7ac5" stroke="#7d3c98" stroke-width="2"/>
    <rect x="266" y="410" width="40" height="40" rx="7" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
    <rect x="226" y="450" width="40" height="40" rx="7" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
    <!-- Block shine -->
    <rect x="191" y="415" width="14" height="5" rx="2" fill="#fff" opacity="0.45"/>
    <rect x="231" y="415" width="14" height="5" rx="2" fill="#fff" opacity="0.45"/>
    <rect x="271" y="415" width="14" height="5" rx="2" fill="#fff" opacity="0.45"/>
    <rect x="231" y="455" width="14" height="5" rx="2" fill="#fff" opacity="0.45"/>
  </g>

  <!-- ===== CAT (sitting on top of T-piece) ===== -->
  <g filter="url(#shadow)">
    <!-- Tail (behind body) -->
    <path d="M 340 310 Q 400 260 405 305 Q 410 355 370 370" fill="none" stroke="url(#catFur)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 340 310 Q 400 260 405 305 Q 410 355 370 370" fill="none" stroke="#E8A020" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <circle cx="370" cy="368" r="11" fill="#E8A020" opacity="0.5"/>

    <!-- Cat body -->
    <ellipse cx="256" cy="330" rx="90" ry="68" fill="url(#catFur)" stroke="#E8A020" stroke-width="3"/>
    <!-- Belly -->
    <ellipse cx="256" cy="335" rx="58" ry="48" fill="url(#belly)"/>

    <!-- Cat ears -->
    <polygon points="155,155 180,72 222,142" fill="url(#catFur)" stroke="#E8A020" stroke-width="3"/>
    <polygon points="357,155 332,72 290,142" fill="url(#catFur)" stroke="#E8A020" stroke-width="3"/>
    <!-- Inner ears -->
    <polygon points="167,150 185,90 215,140" fill="#FFB6C1"/>
    <polygon points="345,150 327,90 297,140" fill="#FFB6C1"/>

    <!-- Cat head -->
    <ellipse cx="256" cy="195" rx="105" ry="90" fill="url(#catFur)" stroke="#E8A020" stroke-width="3"/>

    <!-- Tabby stripes on forehead -->
    <path d="M 232 145 Q 256 130 280 145" stroke="#D4891A" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 224 158 Q 256 142 288 158" stroke="#D4891A" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!-- Eyes - big anime-style -->
    <ellipse cx="218" cy="190" rx="26" ry="28" fill="#fff"/>
    <ellipse cx="294" cy="190" rx="26" ry="28" fill="#fff"/>
    <!-- Iris -->
    <ellipse cx="222" cy="193" rx="17" ry="21" fill="#4CAF50"/>
    <ellipse cx="290" cy="193" rx="17" ry="21" fill="#4CAF50"/>
    <!-- Pupil -->
    <ellipse cx="224" cy="195" rx="9" ry="14" fill="#1B5E20"/>
    <ellipse cx="288" cy="195" rx="9" ry="14" fill="#1B5E20"/>
    <!-- Eye highlights -->
    <circle cx="230" cy="184" r="6.5" fill="#fff" opacity="0.9"/>
    <circle cx="296" cy="184" r="6.5" fill="#fff" opacity="0.9"/>
    <circle cx="218" cy="200" r="3.5" fill="#fff" opacity="0.5"/>
    <circle cx="284" cy="200" r="3.5" fill="#fff" opacity="0.5"/>

    <!-- Nose -->
    <ellipse cx="256" cy="224" rx="9" ry="6.5" fill="#FF8A80"/>
    <ellipse cx="254" cy="222" rx="3.5" ry="2.5" fill="#FFB6C1" opacity="0.6"/>

    <!-- Mouth -->
    <path d="M 247 232 Q 251 241 256 232" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 256 232 Q 261 241 265 232" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Tongue -->
    <ellipse cx="256" cy="240" rx="5" ry="3.5" fill="#FF8A80" opacity="0.7"/>

    <!-- Whiskers -->
    <line x1="132" y1="210" x2="192" y2="218" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="136" y1="224" x2="192" y2="225" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="140" y1="238" x2="195" y2="233" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="380" y1="210" x2="320" y2="218" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="376" y1="224" x2="320" y2="225" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="372" y1="238" x2="318" y2="233" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Cheek blush -->
    <circle cx="192" cy="220" r="16" fill="#FF8A80" opacity="0.25"/>
    <circle cx="320" cy="220" r="16" fill="#FF8A80" opacity="0.25"/>

    <!-- Paws resting on T-piece -->
    <!-- Left paw -->
    <ellipse cx="195" cy="395" rx="26" ry="20" fill="url(#catFur)" stroke="#E8A020" stroke-width="2"/>
    <circle cx="185" cy="400" r="5.5" fill="url(#belly)" opacity="0.8"/>
    <circle cx="197" cy="403" r="5.5" fill="url(#belly)" opacity="0.8"/>
    <circle cx="209" cy="400" r="5.5" fill="url(#belly)" opacity="0.8"/>
    <!-- Right paw -->
    <ellipse cx="317" cy="395" rx="26" ry="20" fill="url(#catFur)" stroke="#E8A020" stroke-width="2"/>
    <circle cx="307" cy="400" r="5.5" fill="url(#belly)" opacity="0.8"/>
    <circle cx="319" cy="403" r="5.5" fill="url(#belly)" opacity="0.8"/>
    <circle cx="331" cy="400" r="5.5" fill="url(#belly)" opacity="0.8"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD700" opacity="0.8">
    <polygon points="80,280 84,270 88,280 84,290" transform="rotate(22,84,280)"/>
    <polygon points="432,180 436,170 440,180 436,190" transform="rotate(-15,436,180)"/>
    <polygon points="100,130 103,123 106,130 103,137" transform="rotate(10,103,130)"/>
    <polygon points="420,310 423,303 426,310 423,317"/>
  </g>
</svg> 